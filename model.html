<!doctype html>
<html lang="ko">
<head>

<title>합정역 3번출구 반경 1km 3D</title>
<style>
  :root { --panel: rgba(255,255,255,.92); --ink: #1f2933; --sub: #5b6672; --line: #d9dee3; --accent: #d9382e; }
  body.night { --panel: rgba(22,27,38,.9); --ink: #e8edf3; --sub: #9aa6b4; --line: #364152; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3f1; color: var(--ink);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #panel { position: fixed; top: 16px; left: 16px; width: 290px; max-width: calc(100vw - 32px); background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; backdrop-filter: blur(6px);
    box-shadow: 0 6px 24px rgba(0,0,0,.12); font-size: 13px; line-height: 1.5; }
  #panel h1 { font-size: 16px; margin: 0 0 2px; }
  #panel .sub { color: var(--sub); margin: 0 0 10px; }
  #status { margin: 8px 0; padding: 7px 9px; border-radius: 8px; background: rgba(120,140,160,.14); }
  #status.err { background: rgba(217,56,46,.14); color: #b3261e; }
  body.night #status.err { color: #ff9d95; }
  .bar { height: 4px; border-radius: 2px; background: rgba(120,140,160,.25); margin-top: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0; }
  dt { color: var(--sub); } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; margin: 8px 0; }
  .toggles label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .legend { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; color: var(--sub); }
  .legend .grad { flex: 1; height: 8px; border-radius: 4px;
    background: linear-gradient(90deg, #efe9dd, #d8d5cc, #b9c6d3, #8ea9c6, #5f86b3); }
  .btns { display: flex; gap: 6px; margin-top: 8px; }
  button { font: inherit; font-size: 12.5px; color: var(--ink); background: transparent; border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 8px; cursor: pointer; white-space: nowrap; flex: 1; }
  button:hover { background: rgba(120,140,160,.16); }
  .help { color: var(--sub); font-size: 12px; margin-top: 8px; }
  #credit { position: fixed; right: 10px; bottom: 8px; font-size: 11px; color: var(--sub); background: var(--panel);
    padding: 3px 8px; border-radius: 6px; max-width: calc(100vw - 20px); }
  #credit a { color: inherit; }
  #tip { position: fixed; display: none; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 4px 16px rgba(0,0,0,.15);
    max-width: 260px; z-index: 5; }
  #tip b { font-size: 13.5px; }
  .lb { transition: opacity .15s; font-size: 11.5px; padding: 1px 6px; border-radius: 10px; white-space: nowrap; color: #1f2933;
    background: rgba(255,255,255,.82); border: 1px solid rgba(0,0,0,.12); }
  .lb.road { background: rgba(60,66,74,.82); color: #fff; border: none; }
  .lb.bld { background: rgba(255,255,255,.9); font-weight: 600; }
  .lb.green { background: rgba(214,238,206,.9); }
  .lb.water { background: rgba(196,226,246,.9); color: #1b4f72; font-weight: 600; }
  .lb.station { background: #2f9e44; color: #fff; border: none; font-weight: 700; font-size: 12.5px; padding: 2px 8px; }
  .lb.exit { background: #fff; border: 1.5px solid #2f9e44; color: #1b5e2b; font-weight: 700; font-size: 10.5px;
    padding: 0 5px; border-radius: 8px; }
  .lb.pin { background: var(--accent); color: #fff; border: none; font-weight: 700; font-size: 13.5px; padding: 4px 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .lb.north { background: #1f2933; color: #fff; border: none; font-weight: 700; }
  @media (max-width: 560px) { #panel { width: auto; right: 16px; } .help { display: none; } }
  #panel-close { position: absolute; top: 8px; right: 8px; flex: none; width: 26px; height: 26px; padding: 0; border: none; font-size: 15px; line-height: 1; color: var(--sub); }
  #panel-open { position: fixed; top: 16px; left: 16px; z-index: 1000; display: none; flex: none; background: var(--panel); padding: 7px 11px;
    box-shadow: 0 4px 16px rgba(0,0,0,.2); backdrop-filter: blur(6px); }
  body.panel-hidden #panel { display: none; }
  body.panel-hidden #panel-open { display: block; }
</style>

<body>

<button id="panel-open" title="안내판 보이기 (H)">☰ 안내판</button>

  <h1>합정역 3번출구 반경 1km</h1>
  <p class="sub">실제 건물 윤곽과 층수로 만든 3D 모형</p>
  <div id="status">불러오는 중…<div class="bar"><i id="bar"></i></div></div>
  <dl>
    <dt>건물 수</dt><dd id="s-count">–</dd>

  </div>

  <p class="help">왼쪽 드래그: 회전 · 오른쪽 드래그: 이동 · 휠: 확대/축소<br>건물에 마우스를 올리면 주소와 층수가 나옵니다.</p>
</div>

<div id="tip"></div>
<div id="credit">건물: <a href="https://www.vworld.kr" target="_blank" rel="noopener">브이월드(국토교통부) 오픈API</a> ·
  도로·수계·녹지: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>

<script src="config.js"></script>
<script src="osm_data.js"></script>
<script src="buildings_data.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const CFG = window.APP_CONFIG;
const OSM = window.OSM_DATA;
const R = OSM.radius;
const C0 = OSM.center;
const MX = Math.cos(C0.lat * Math.PI / 180) * 111320, MZ = 110574;
const proj = (lon, lat) => [(lon - C0.lon) * MX, -(lat - C0.lat) * MZ]; // x=동, z=남 (북쪽이 -z)
const $ = (id) => document.getElementById(id);

// ---------- 기본 장면 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('app').appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer({ element: $('labels') });

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 10, 9000);
const HOME = { pos: new THREE.Vector3(520, 1250, 2050), target: new THREE.Vector3(0, 0, 40) };
camera.position.copy(HOME.pos);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.target);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 40;
controls.maxDistance = 3800;
controls.screenSpacePanning = false;

const hemi = new THREE.HemisphereLight(0xffffff, 0x8d8a80, 1.15);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e0, 2.1);
sun.position.set(-900, 1300, 700);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -1150, right: 1150, top: 1150, bottom: -1150, near: 100, far: 3600 });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.6;
scene.add(sun);

// ---------- 바닥(디오라마 받침) ----------
const flatMat = (color, extra = {}) => new THREE.MeshLambertMaterial({ color, ...extra });
const ground = new THREE.Mesh(new THREE.CircleGeometry(R, 160).rotateX(-Math.PI / 2), flatMat(0xe9e6de));
ground.receiveShadow = true;
scene.add(ground);
const base = new THREE.Mesh(new THREE.CylinderGeometry(R, R * 0.985, 26, 160, 1, true), flatMat(0xa9a59b));
base.position.y = -13.02;
scene.add(base);
const baseBottom = new THREE.Mesh(new THREE.CircleGeometry(R * 0.985, 96).rotateX(Math.PI / 2), flatMat(0x8f8b82));
baseBottom.position.y = -26;
scene.add(baseBottom);

// ---------- OSM: 면(수계·녹지) ----------
function polyMesh(list, color, y, opts = {}) {
  const geos = [];
  for (const f of list) {
    const p = f.p;
    if (p.length < 6) continue;
    const shape = new THREE.Shape();
    shape.moveTo(p[0], -p[1]);
    for (let i = 2; i < p.length; i += 2) shape.lineTo(p[i], -p[i + 1]);
    const g = new THREE.ShapeGeometry(shape);
    g.deleteAttribute('uv');
    geos.push(g);
  }
  if (!geos.length) return null;
  const geo = mergeGeometries(geos, false).rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, flatMat(color, opts));
  m.position.y = y;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}
const greenMesh = polyMesh(OSM.green, 0xbfdcae, 0.2);
const waterMesh = polyMesh(OSM.water, 0x9cc9e8, 0.35);
if (waterMesh) waterMesh.material = new THREE.MeshPhongMaterial({ color: 0x9cc9e8, specular: 0x9fb4c8, shininess: 90 }); // 물빛 반사
const islandMesh = polyMesh(OSM.islands, 0xd9e6c8, 0.45);

// ---------- OSM: 도로(띠 형태) ----------
const ROAD = {
  A: { w: 22, y: 1.05, color: 0x5d646d },
  B: { w: 13, y: 0.95, color: 0x6f767f },
  C: { w: 9, y: 0.85, color: 0x868c94 },
  D: { w: 6, y: 0.75, color: 0xa4a9af },
  E: { w: 3.6, y: 0.65, color: 0xb9bcc0 },
  F: { w: 2, y: 0.55, color: 0xcfc6b4 },
};
function ribbonGeometry(lines) { // lines: [{p:[x,z,...], w, y}]
  const pos = [], idx = [];
  for (const { p, w, y } of lines) {
    const n = p.length / 2;
    if (n < 2) continue;
    const start = pos.length / 3;
    for (let i = 0; i < n; i++) {
      const x = p[i * 2], z = p[i * 2 + 1];
      const a = Math.max(i - 1, 0), b = Math.min(i + 1, n - 1);
      let tx = p[b * 2] - p[a * 2], tz = p[b * 2 + 1] - p[a * 2 + 1];
      const len = Math.hypot(tx, tz) || 1;
      tx /= len; tz /= len;
      const nx = -tz * w / 2, nz = tx * w / 2;
      pos.push(x + nx, y, z + nz, x - nx, y, z - nz);
    }
    for (let i = 0; i < n - 1; i++) {
      const o = start + i * 2;
      idx.push(o, o + 2, o + 1, o + 1, o + 2, o + 3); // 윗면이 앞면이 되도록
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const normals = new Float32Array(pos.length);
  for (let i = 1; i < normals.length; i += 3) normals[i] = 1;
  g.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
  g.setIndex(idx);
  return g;
}
const roadGroup = new THREE.Group();
scene.add(roadGroup);
for (const cls of Object.keys(ROAD)) {
  const spec = ROAD[cls];
  const surface = [], tunnels = [];
  for (const r of OSM.roads) {
    if (r.c !== cls) continue;
    const w = r.l && cls !== 'F' ? Math.max(spec.w * 0.6, Math.min(r.l * 3.3, 36)) : spec.w;
    (r.u ? tunnels : surface).push({ p: r.p, w, y: spec.y + (r.b ? 0.35 : 0) });
  }
  if (surface.length) {
    const m = new THREE.Mesh(ribbonGeometry(surface), flatMat(spec.color, { side: THREE.DoubleSide }));
    m.receiveShadow = true;
    roadGroup.add(m);
  }
  if (tunnels.length && cls !== 'F') { // 지하차도·터널은 반투명으로
    const m = new THREE.Mesh(ribbonGeometry(tunnels),
      flatMat(spec.color, { side: THREE.DoubleSide, transparent: true, opacity: 0.3, depthWrite: false }));
    roadGroup.add(m);
  }
  if (surface.length && 'AB'.includes(cls)) { // 큰 도로 가운데 차선
    const marks = surface.map((s) => ({ p: s.p, w: 0.32, y: s.y + 0.06 }));
    roadGroup.add(new THREE.Mesh(ribbonGeometry(marks), flatMat(0xe9e9e4, { side: THREE.DoubleSide })));
  }
}

// ---------- 나무(가로수·공원) ----------
const treeGroup = new THREE.Group();
scene.add(treeGroup);
const crownMat = new THREE.MeshLambertMaterial({ flatShading: true });
let cullTreesInBuildings = () => {};
const bldCells = new Set(); // 건물이 차지한 2m 격자 칸
const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6b5241 });
{
  let seedN = 20261113;
  const rand = () => { seedN |= 0; seedN = seedN + 0x6D2B79F5 | 0; let t = Math.imul(seedN ^ seedN >>> 15, 1 | seedN);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  // 도로가 차지한 자리(2m 격자). 나무가 차도 위에 서지 않게 한다.
  const CELL = 2, GN = Math.ceil(R * 2 / CELL), occ = new Uint8Array(GN * GN);
  const gi = (v) => Math.floor((v + R) / CELL);
  const roadW = (r) => { const s = ROAD[r.c]; return r.l && r.c !== 'F' ? Math.max(s.w * 0.6, Math.min(r.l * 3.3, 36)) : s.w; };
  for (const r of OSM.roads) {
    if (r.c === 'F' || r.u) continue;
    const rad = roadW(r) / 2 + 0.6, k = Math.ceil(rad / CELL);
    for (let i = 0; i < r.p.length - 2; i += 2) {
      const ax = r.p[i], az = r.p[i + 1], dx = r.p[i + 2] - ax, dz = r.p[i + 3] - az, n = Math.max(1, Math.ceil(Math.hypot(dx, dz) / 1.5));
      for (let s = 0; s <= n; s++) {
        const cx = gi(ax + dx * s / n), cz = gi(az + dz * s / n);
        for (let a = -k; a <= k; a++) for (let b = -k; b <= k; b++) {
          const x = cx + a, z = cz + b;
          if (x >= 0 && z >= 0 && x < GN && z < GN && a * a + b * b <= k * k) occ[z * GN + x] = 1;
        }
      }
    }
  }
  const free = (x, z) => x * x + z * z < (R - 12) * (R - 12) && !occ[gi(z) * GN + gi(x)];
  const inPoly = (p, x, z) => { let c = false; for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2) {
    if ((p[i + 1] > z) !== (p[j + 1] > z) && x < (p[j] - p[i]) * (z - p[i + 1]) / (p[j + 1] - p[i + 1]) + p[i]) c = !c; } return c; };
  const spots = [];
  // 가로수: 큰 도로 양쪽 가장자리에 일정 간격으로
  for (const r of OSM.roads) {
    if (!'ABC'.includes(r.c) || r.u || r.b) continue;
    const off = roadW(r) / 2 + 2.2;
    let carry = rand() * 14;
    for (let i = 0; i < r.p.length - 2; i += 2) {
      const ax = r.p[i], az = r.p[i + 1], dx = r.p[i + 2] - ax, dz = r.p[i + 3] - az, len = Math.hypot(dx, dz);
      if (!len) continue;
      while (carry < len) {
        const px = ax + dx * carry / len, pz = az + dz * carry / len;
        for (const side of [-1, 1]) {
          const x = px - dz / len * off * side, z = pz + dx / len * off * side;
          if (free(x, z)) spots.push([x, z, 0.8 + rand() * 0.45]);
        }
        carry += 12 + rand() * 5;
      }
      carry -= len;
    }
  }
  // 공원·녹지: 면적에 비례해 흩뿌림
  for (const g of OSM.green) {
    const p = g.p;
    if (p.length < 6) continue;
    let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
    for (let i = 0; i < p.length; i += 2) { x0 = Math.min(x0, p[i]); x1 = Math.max(x1, p[i]); z0 = Math.min(z0, p[i + 1]); z1 = Math.max(z1, p[i + 1]); }
    const want = Math.min(350, Math.round(centroidArea(p).area / 150));
    for (let n = 0, tries = 0; n < want && tries < want * 12; tries++) {
      const x = x0 + rand() * (x1 - x0), z = z0 + rand() * (z1 - z0);
      if (inPoly(p, x, z) && free(x, z)) { spots.push([x, z, 0.85 + rand() * 0.75]); n++; }
    }
  }
  const crowns = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), crownMat, spots.length);
  const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.2, 0.3, 1, 5), trunkMat, spots.length);
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), S = new THREE.Vector3(), P = new THREE.Vector3(), col = new THREE.Color();
  const greens = [0x5f9a4a, 0x6faa55, 0x4f8a45, 0x7fb163, 0x86a24a];
  spots.forEach(([x, z, k], i) => {
    const th = 2.6 * k, cr = 2.5 * k;
    Q.setFromAxisAngle(THREE.Object3D.DEFAULT_UP, rand() * Math.PI);
    trunks.setMatrixAt(i, M.compose(P.set(x, th / 2 + 0.5, z), Q, S.set(1, th, 1)));
    crowns.setMatrixAt(i, M.compose(P.set(x, th + cr * 0.75 + 0.5, z), Q, S.set(cr, cr * 1.15, cr)));
    crowns.setColorAt(i, col.set(greens[i % greens.length]).multiplyScalar(0.9 + rand() * 0.2));
  });
  crowns.castShadow = true;
  crowns.receiveShadow = true;
  treeGroup.add(crowns, trunks);
  window.__treeCount = spots.length;
  // 건물을 다 불러온 뒤, 건물 자리에 겹친 나무는 치운다.
  cullTreesInBuildings = () => {
    const zero = new THREE.Matrix4().makeScale(0, 0, 0);
    let removed = 0;
    spots.forEach(([x, z], i) => {
      if (!bldCells.has(Math.floor(z / 2) * 4096 + Math.floor(x / 2))) return;
      crowns.setMatrixAt(i, zero); trunks.setMatrixAt(i, zero); removed++;
    });
    crowns.instanceMatrix.needsUpdate = true; trunks.instanceMatrix.needsUpdate = true;
    window.__treeCount = spots.length - removed;
  };
}
// 지하철 선로(지하): 점선
{
  const pts = [];
  for (const r of OSM.rails) for (let i = 0; i < r.p.length - 2; i += 2) {
    pts.push(new THREE.Vector3(r.p[i], 1.6, r.p[i + 1]), new THREE.Vector3(r.p[i + 2], 1.6, r.p[i + 3]));
  }
  if (pts.length) {
    const line = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineDashedMaterial({ color: 0x2f9e44, dashSize: 14, gapSize: 9, transparent: true, opacity: 0.75 }));
    line.computeLineDistances();
    roadGroup.add(line);
  }
}

// ---------- 반경 1km 테두리, 3번출구 핀 ----------
{
  const pts = [];
  for (let i = 0; i <= 256; i++) { const a = i / 256 * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * R, 1.8, Math.sin(a) * R)); }
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xd9382e })));
}
const pin = new THREE.Group();

    }
    total = parseInt(res.page.total, 10) || 1;
    addBuildingBatch(res.result.featureCollection.features || []);
    refreshStats();
    page++;
    await new Promise((r) => setTimeout(r, 30)); // 화면 갱신 틈
  }
  finishBuildings();
}
function finishBuildings() {
  // 이름 있는 고층 건물 이름표
  const seen = new Set();
  tallNamed.sort((a, b) => b.floors - a.floors).forEach((it) => {
    if (seen.size >= 40 || seen.has(it.name)) return;
    seen.add(it.name);
    addLabel(it.name, 'bld', it.cx, it.h + 8, it.cz, labelGroup, Math.min(it.floors, 60) / 4);
  });
  cullTreesInBuildings();
  setStatus('완료 · 건물 ' + stats.count.toLocaleString() + '동을 표시했습니다.');
  window.__ready = true;
}
loadBuildings().catch((e) => {
  console.error(e);
  setStatus('건물을 불러오지 못했습니다.<br>' + (e && e.message ? e.message : e) + '<br>인터넷 연결과 인증키(만료일)를 확인해 주세요.', true);
  window.__ready = 'error';
});

// ---------- 건물 가리키기(툴팁 + 강조) ----------
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let pointer = null, dragging = false, hovered = null;
const hiMat = new THREE.MeshLambertMaterial({ color: 0xffc233, emissive: 0x7a4a00 });
let hiMesh = null;
renderer.domElement.addEventListener('pointermove', (e) => { pointer = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerleave', () => { pointer = null; });
controls.addEventListener('start', () => { dragging = true; });
controls.addEventListener('end', () => { dragging = false; });

function findItem(mesh, faceIndex) {
  const { starts, items } = mesh.userData;
  const v = faceIndex * 3;
  let lo = 0, hi = starts.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (starts[mid] <= v) lo = mid; else hi = mid - 1; }
  return items[lo];
}
function setHover(item) {
  if (item === hovered) return;
  hovered = item;
  if (hiMesh) { scene.remove(hiMesh); hiMesh.geometry.dispose(); hiMesh = null; }
  const tip = $('tip');
  if (!item) { tip.style.display = 'none'; return; }
  hiMesh = new THREE.Mesh(extrude(featureShapes(item.geometry), item.h + 0.4), hiMat);
  hiMesh.scale.set(1.004, 1, 1.004);
  hiMesh.position.set(-item.cx * 0.004, 0, -item.cz * 0.004);
  scene.add(hiMesh);
  tip.innerHTML = '';
  const b = document.createElement('b');
  b.textContent = item.name || item.addr.split(' ').slice(-2).join(' ');
  tip.appendChild(b);
  const lines = [];
  if (item.detail) lines.push(item.detail);
  lines.push(item.addr);
  lines.push(item.floors ? '지상 ' + item.floors + '층 · 약 ' + Math.round(item.h) + 'm(추정)' : '층수 정보 없음 · ' + CFG.unknownFloors + '층으로 가정');
  for (const t of lines) { const d = document.createElement('div'); d.textContent = t; tip.appendChild(d); }
  tip.style.display = 'block';
}
function updateHover() {
  if (!pointer || dragging) { setHover(null); return; }
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.set(((pointer.x - rect.left) / rect.width) * 2 - 1, -((pointer.y - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(mouse, camera);
  const hit = raycaster.intersectObjects(buildingGroup.children, false)[0];
  setHover(hit ? findItem(hit.object, hit.faceIndex) : null);
  if (hovered) {
    const tip = $('tip');
    const x = Math.min(pointer.x + 16, window.innerWidth - tip.offsetWidth - 8);
    const y = Math.min(pointer.y + 16, window.innerHeight - tip.offsetHeight - 8);
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }
}

// ---------- 화면 조작 ----------
let fly = null, frame = 0;
function flyTo(pos, target, ms = 900) {
  fly = { t0: performance.now(), ms, p0: camera.position.clone(), q0: controls.target.clone(), p1: pos.clone(), q1: target.clone() };
}
$('b-home').onclick = () => flyTo(HOME.pos, HOME.target);
$('b-top').onclick = () => flyTo(new THREE.Vector3(0, Math.max(2900, 2900 / camera.aspect * 1.05), 1), new THREE.Vector3(0, 0, 0));
$('b-exit').onclick = () => flyTo(new THREE.Vector3(150, 230, 330), new THREE.Vector3(0, 10, 0));
$('t-labels').onchange = (e) => { labelGroup.visible = e.target.checked; };
$('t-roads').onchange = (e) => { roadGroup.visible = e.target.checked; };
$('t-shadow').onchange = (e) => { sun.castShadow = e.target.checked; };

const DAY = { sky: 0xcfe3f1, fog: 0xcfe3f1, hemiSky: 0xffffff, hemiGround: 0x8d8a80, hemiI: 1.15, sun: 0xfff4e0, sunI: 2.1,
  ground: 0xe9e6de, water: 0x9cc9e8, green: 0xbfdcae, bld: 0xffffff, bldEm: 0x000000 };
const NIGHT = { sky: 0x0d1422, fog: 0x0d1422, hemiSky: 0x4a5f8a, hemiGround: 0x1a1d26, hemiI: 1.35, sun: 0x9db4ff, sunI: 1.0,
  ground: 0x2a2d35, water: 0x1b3d61, green: 0x26402b, bld: 0x8791a8, bldEm: 0x0b0d14 };
function applyMode(night) {
  const m = night ? NIGHT : DAY;
  document.body.classList.toggle('night', night);
  document.body.style.background = '#' + new THREE.Color(m.sky).getHexString();
  scene.background = new THREE.Color(m.sky);
  scene.fog = new THREE.Fog(m.fog, 3200, 8200);
  hemi.color.set(m.hemiSky); hemi.groundColor.set(m.hemiGround); hemi.intensity = m.hemiI;
  sun.color.set(m.sun); sun.intensity = m.sunI;
  ground.material.color.set(m.ground);
  if (waterMesh) waterMesh.material.color.set(m.water);
  if (greenMesh) greenMesh.material.color.set(m.green);
  if (islandMesh) islandMesh.material.color.set(night ? 0x2c3a2c : 0xd9e6c8);
  buildingMat.color.set(m.bld);
  buildingMat.emissive.set(m.bldEm);
  bldUniforms.uNight.value = night ? 1 : 0;
  crownMat.color.set(night ? 0x4a5560 : 0xffffff);
  trunkMat.color.set(night ? 0x2e2a28 : 0x6b5241);
}
$('t-trees').onchange = (e) => { treeGroup.visible = e.target.checked; };
$('t-hcolor').onchange = (e) => {
  bldUniforms.uHeightMode.value = e.target.checked ? 1 : 0;
  $('legend').style.display = e.target.checked ? 'flex' : 'none';
};
$('t-night').onchange = (e) => applyMode(e.target.checked);
applyMode(false);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

renderer.setAnimationLoop(() => {
  if (fly) {
    const k = Math.min(1, (performance.now() - fly.t0) / fly.ms);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    camera.position.lerpVectors(fly.p0, fly.p1, e);
    controls.target.lerpVectors(fly.q0, fly.q1, e);
    if (k >= 1) fly = null;
  }
  controls.update();
  updateHover();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  if (frame++ % 4 === 0) declutterLabels();
});
window.__scene = { scene, camera, controls, stats, flyTo, THREE };
</script>
<script>
  // 안내판 숨기기/보이기: ✕ 버튼, ☰ 버튼, 또는 H 키. 선택은 다음에 열 때도 유지된다.
  (function () {
    const set = (hidden) => {
      document.body.classList.toggle('panel-hidden', hidden);
      try { localStorage.setItem('panelHidden', hidden ? '1' : '0'); } catch (e) {}
    };
    let saved = '0';
    try { saved = localStorage.getItem('panelHidden') || '0'; } catch (e) {}
    set(saved === '1');
    document.getElementById('panel-close').onclick = () => set(true);
    document.getElementById('panel-open').onclick = () => set(false);
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'h' || e.key === 'H' || e.key === 'ㅗ') && !e.ctrlKey && !e.altKey && !e.metaKey && !(/INPUT|TEXTAREA/.test(e.target.tagName) && e.target.type !== 'checkbox')) set(!document.body.classList.contains('panel-hidden'));
    });
  })();
</script>
